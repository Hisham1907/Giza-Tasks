<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Item Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <header class="text-center mb-4">
        <h1 class="display-5 fw-bold">Item Manager</h1>
      </header>
      <main class="row justify-content-center">
        <div class="col col-12 col-md-8 col-lg-6">
          <div class="card p-4 shadow-sm rounded-2 mb-5">
            <div class="mb-3">
              <label for="itemInput" class="form-label">Enter an Item:</label>
              <input
                type="text"
                class="form-control"
                id="itemInput"
                placeholder="Type something..."
              />
            </div>
            <div class="d-flex">
              <button class="btn flex-fill btn-primary" id="addBtn">Add</button>
              <button class="btn flex-fill mx-3 btn-secondary" id="displayBtn">
                Display
              </button>
              <button class="btn flex-fill btn-danger" id="deleteAllBtn">
                Delete All
              </button>
            </div>
          </div>
          <div class="card p-4 shadow-sm rounded-2">
            <table class="table table-striped table-bordered">
              <thead class="bg-primary text-white">
                <tr>
                  <th>Index Number</th>
                  <th>Item Name</th>
                </tr>
              </thead>
              <tbody id="itemTableBody">
                <!-- Items will be added here -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="content/js/main.js" type="text/javascript"></script>
  </body>
</html>
