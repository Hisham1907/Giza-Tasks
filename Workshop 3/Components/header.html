<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/styles.css">

    <title>header</title>
</head>
<body>
     <!-- Header -->
     <header
     class="shadow grid-col-span-3 rounded-2 d-flex justify-between align-center p-3-y p-6-x bg-white">
     <div class="d-flex w-100">
       <a
         href="index.html"
         class="logo d-flex justify-center align-center m-8-r"
       >
         <img class="m-1-r" src="../assets/images/logo.svg" alt="logo" />
         <span class="fw-2xl fs-sm text-blue">TASK</span>
       </a>
       <div class="search-bar p-5-x p-2-y w-100 d-flex m-8-r bg-gray rounded-full">
         <svg
           width="14"
           height="14"
           viewBox="0 0 14 14"
           fill="none"
           xmlns="http://www.w3.org/2000/svg"
         >
           <g opacity="0.5">
             <path
               fill-rule="evenodd"
               clip-rule="evenodd"
               d="M5.91314 10.8263C8.6266 10.8263 10.8263 8.6266 10.8263 5.91314C10.8263 3.19969 8.6266 1 5.91314 1C3.19969 1 1 3.19969 1 5.91314C1 8.6266 3.19969 10.8263 5.91314 10.8263Z"
               stroke="#121212"
               stroke-width="1.5"
               stroke-linecap="round"
               stroke-linejoin="round"
             />
             <path
               d="M9.71931 9.71888L12.8074 12.807"
               stroke="#121212"
               stroke-width="1.5"
               stroke-linecap="round"
               stroke-linejoin="round"
             />
           </g>
         </svg>
         <input
           class="w-100 m-6-l"
           type="text"
           name="search"
           placeholder="Search everything"
         />
       </div>
     </div>
     <nav class="p-l-r">
       <ul class="d-flex align-center">
         <li>
           <a class="fs-md fw-xl text-gray-1 active" href="">Projects</a>
         </li>
         <li><a class="fs-md fw-xl text-gray-1" href="">Settings</a></li>
         <li><a class="fs-md fw-xl text-gray-1" href="">Help</a></li>
       </ul>
     </nav>
   </header>
</body>
</html>
